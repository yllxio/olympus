openapi: 3.1.0
info:
  title: Олимпус API
  version: 1.0.0
paths:
  /api/olympus:
    get:
      summary: Published records, current profile and saved progress
      responses:
        '200':
          description: Task answers omitted; active mock solutions omitted
        '503':
          description: Storage unavailable
    post:
      summary: Perform an application action
      description: Admin actions require the admin flag of the server session. Cookies are HttpOnly. Cross-origin mutations are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [session, admin-login, admin-logout, view-lesson, star, register, code-draft, check, reveal, hint, run, start-mock, mock-save, finish-mock, mock-proof, history, restore, delete, deleted, draft, publish, import, upload]
                id: {type: string}
                password: {type: string}
                initData: {type: string}
                record: {type: object}
                records: {type: array, items: {type: object}}
                answer: {type: string}
                answers: {type: object}
                code: {type: string}
                language: {type: string, enum: [python, cpp, java, javascript, kotlin, pascal]}
                correct: {type: boolean}
                yes: {type: boolean}
                revisionId: {type: string}
                taskId: {type: string}
                base64: {type: string}
                type: {type: string}
      responses:
        '200': {description: Action result}
        '400': {description: Validation error}
        '401': {description: Session required}
        '403': {description: Admin required or forbidden origin}
  /api/media/{id}:
    get:
      summary: Read an uploaded educational attachment
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Binary media}
        '404': {description: Not found}
